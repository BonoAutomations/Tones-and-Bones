[project]
name = "tones-and-bones"
version = "0.1.0"
description = "Luxury Sales and Marketing Automation - ML System"
requires-python = ">=3.10"
dependencies = [
    # ML Core
    "torch>=2.2.0",
    "lightning>=2.2.0",
    "torchmetrics>=1.3.0",
    # Data
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pydantic>=2.6.0",
    # Experiment Tracking
    "mlflow>=2.10.0",
    "wandb>=0.16.0",
    # Explainability & Fairness
    "shap>=0.45.0",
    "fairlearn>=0.10.0",
    # RAG / Memory
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Utils
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
